name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job: these jobs build, test and pass artifacts
# between themselves (which uses the run's own artifact token, not this one).
# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  tokens:
    name: design-tokens build + contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version comes from package.json `packageManager`; naming it here too
      # makes pnpm/action-setup refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter @aisecretary/design-tokens build

      - name: Contrast gate (WCAG AA)
        run: pnpm --filter @aisecretary/design-tokens contrast-check

      - name: Upload contrast report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contrast-report
          path: packages/design-tokens/build/tokens.contrast-report.json

      - name: Upload built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-tokens-build
          path: packages/design-tokens/build/

  typecheck:
    name: typecheck (workspace)
    needs: tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version comes from package.json `packageManager`; naming it here too
      # makes pnpm/action-setup refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore design-tokens build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: design-tokens-build
          path: packages/design-tokens/build/

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Provider isolation check (notifications)
        run: pnpm --filter @aisecretary/notifications check:isolation

      - name: Provider isolation check (transcription)
        run: pnpm --filter @aisecretary/transcription check:isolation

      - name: Provider isolation check (llm-gateway)
        run: pnpm --filter @aisecretary/llm-gateway check:isolation

      - name: Provider isolation check (bot)
        run: pnpm --filter @aisecretary/bot check:isolation

      - name: Audit-coverage check (api)
        run: pnpm --filter @aisecretary/api check:audit-coverage

      - name: Telemetry registry check (shared)
        run: pnpm --filter @aisecretary/shared check:telemetry

      - name: Citation-required check (modules)
        run: pnpm --filter @aisecretary/modules check:citations

      - name: Test
        run: pnpm test

  e2e:
    name: e2e (playwright)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pnpm version comes from package.json `packageManager`; naming it here too
      # makes pnpm/action-setup refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore design-tokens build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: design-tokens-build
          path: packages/design-tokens/build/

      - name: Install Playwright browsers
        run: pnpm --filter @aisecretary/e2e exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: pnpm e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
